<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COUGAR — Payment Status</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main style="min-height:100vh;display:grid;place-items:center;padding:32px;background:var(--bg-main);">
    <section id="stripe-return-status" style="width:min(620px,100%);background:#fff;border:1px solid var(--border-card);border-radius:24px;padding:48px 32px;text-align:center;box-shadow:var(--shadow-md);">
      <i class="fa-solid fa-circle-notch fa-spin" style="font-size:2rem;margin-bottom:18px;"></i>
      <h1 style="font-size:2rem;margin-bottom:10px;">Verifying Payment</h1>
      <p style="color:var(--text-secondary);">Please wait while we confirm your Stripe payment.</p>
    </section>
  </main>
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
